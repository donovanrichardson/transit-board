services:
  oba_database:
    image: mysql:8.4
    container_name: oba_database
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: oba_database
      MYSQL_USER: ${JDBC_USER:-oba}
      MYSQL_PASSWORD: ${JDBC_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    restart: always
    # mem_limit/cpus: placeholder pending docker-stats-log.sh measurement period
    # (see specs/security-hardening-overarching.md Phase A0/C2).
    mem_limit: 512m
    cpus: 0.5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  oba_app_base:
    build:
      context: https://github.com/OneBusAway/onebusaway-docker.git#main:oba
    image: transit-board-oba_app_base
    profiles:
      - build
    # mem_limit/cpus: placeholder pending docker-stats-log.sh measurement period
    # (see specs/security-hardening-overarching.md Phase A0/C2).
    mem_limit: 512m
    cpus: 0.5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  oba_app:
    container_name: oba_app
    hostname: oba-app
    build:
      context: ./oba-app
      dockerfile: Dockerfile
    environment:
      - JDBC_URL=${JDBC_URL:-jdbc:mysql://oba_database:3306/oba_database}
      - JDBC_DRIVER=com.mysql.cj.jdbc.Driver
      - JDBC_USER=${JDBC_USER:-oba}
      - JDBC_PASSWORD=${JDBC_PASSWORD}
      - TEST_API_KEY=${OBA_API_KEY}
    volumes:
      - ./oba-server/bundle:/bundle
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - oba_database
    restart: always
    # mem_limit: may need raising above 768m if bundle rebuilds OOM-kill near this ceiling;
    # monitor docker-stats-log.sh data during a rebuild before finalizing.
    # (see specs/security-hardening-overarching.md Phase A0/C2).
    mem_limit: 768m
    cpus: 0.75
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  cli:
    build:
      context: ./departure-board
      dockerfile: Dockerfile
    environment:
      - OBA_BASE_URL=http://oba-app:8080
    depends_on:
      - oba_app
    profiles:
      - cli
    # mem_limit/cpus: placeholder pending docker-stats-log.sh measurement period
    # (see specs/security-hardening-overarching.md Phase A0/C2).
    mem_limit: 128m
    cpus: 0.25
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  transit-board-api:
    build:
      context: ./transit-board-api
      dockerfile: Dockerfile
    environment:
      - OBA_BASE_URL=http://oba-app:8080
      - PORT=4000
      - OBA_API_KEY=${OBA_API_KEY}
    depends_on:
      - oba_app
    restart: always
    # mem_limit/cpus: placeholder pending docker-stats-log.sh measurement period
    # (see specs/security-hardening-overarching.md Phase A0/C2).
    mem_limit: 128m
    cpus: 0.25
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - transit-board-api
    restart: always
    # mem_limit/cpus: set in docker-compose.override.yml for deployment environments
    # that use Caddy; also set here as a baseline for standalone runs.
    mem_limit: 64m
    cpus: 0.1
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  gtfs_updater:
    build: ./gtfs-updater
    volumes:
      - ./oba-server/bundle:/bundle
      - ./logs:/logs
    environment:
      - GTFS_FEED_URL=https://rrgtfsfeeds.s3.amazonaws.com/gtfslirr.zip
      - GTFS_UPDATE_HOUR=5
      - MYSQL_HOST=oba_database
      - MYSQL_USER=${JDBC_USER:-oba}
      - MYSQL_PASSWORD=${JDBC_PASSWORD}
      - MYSQL_DATABASE=oba_database
    depends_on:
      - oba_database
    restart: unless-stopped
    # mem_limit/cpus: placeholder pending docker-stats-log.sh measurement period
    # (see specs/security-hardening-overarching.md Phase A0/C2).
    mem_limit: 128m
    cpus: 0.25
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  monitor:
    build: ./monitor
    volumes:
      - /proc:/host/proc:ro
      - ./logs:/logs
    environment:
      - MONITOR_INTERVAL_SECONDS=60
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
    depends_on:
      - docker-socket-proxy
    restart: unless-stopped
    networks:
      - default
      - docker-proxy-internal
    # mem_limit/cpus: placeholder pending docker-stats-log.sh measurement period
    # (see specs/security-hardening-overarching.md Phase A0/C2).
    mem_limit: 64m
    cpus: 0.1
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3
    container_name: transit-board-docker-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      POST: 0
      NETWORKS: 0
      SERVICES: 0
      TASKS: 0
      VOLUMES: 0
      IMAGES: 0
      INFO: 0
      EVENTS: 0
      AUTH: 0
      SECRETS: 0
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      EXEC: 0
      GRPC: 0
      LOG_LEVEL: warning
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-proxy-internal
    mem_limit: 32m
    cpus: 0.05
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql-data:

networks:
  default: {}
  docker-proxy-internal:
    driver: bridge
    internal: true
